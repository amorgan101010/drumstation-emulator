name: Build
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  builds:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: macos-14
            name: macos-arm64
          - os: windows-2022
            name: windows-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.8
          path: JUCE
      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libfreetype6-dev libfontconfig1-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libgl1-mesa-dev
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DDRUMSTATION_PLUGIN=ON -DJUCE_DIR=${{ github.workspace }}/JUCE
      - name: Build
        run: cmake --build build --config Release --parallel 3
      - name: Core tests
        if: runner.os != 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -E sequencer_model
      - name: Windows core test
        if: runner.os == 'Windows'
        run: ctest --test-dir build -C Release --output-on-failure -R '^adsp_core$'
      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: drumstation-${{ matrix.name }}
          path: |
            build/DrumStationPlugin_artefacts/Release/VST3/**
            build/DrumStationPlugin_artefacts/Release/Standalone/**
          if-no-files-found: error
